<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0810" />
    <meta name="color-scheme" content="dark" />
    <title>Save link</title>

    <!--
      Loader styles live here (inlined) so the splash paints instantly,
      before any JS/CSS bundle is downloaded. The React <BrandLoader/> and
      <LinkSkeletons/> components re-use these same `sl-*` classes.
    -->
    <style>
      :root {
        --sl-bg: #0a0810;
        --sl-violet: #8b72ff;
        --sl-indigo: #6366f1;
        --sl-pink: #c084fc;
      }
      html,
      body {
        margin: 0;
        background: var(--sl-bg);
      }

      /* ---------- Full-screen brand loader ---------- */
      .sl-loader {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(60% 50% at 50% 42%, rgba(139, 114, 255, 0.16), transparent 70%),
          var(--sl-bg);
      }
      .sl-loader--inline {
        min-height: calc(100vh - 4rem);
        min-height: calc(100dvh - 4rem);
      }

      .sl-orb {
        position: relative;
        width: 104px;
        height: 104px;
        display: grid;
        place-items: center;
      }
      /* spinning gradient ring */
      .sl-orb::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 50%, var(--sl-indigo) 78%, var(--sl-pink) 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        animation: sl-spin 1.1s linear infinite;
      }
      /* breathing glow */
      .sl-orb::after {
        content: "";
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 114, 255, 0.38), transparent 65%);
        filter: blur(12px);
        z-index: 0;
        animation: sl-glow 2.2s ease-in-out infinite;
      }
      .sl-tile {
        position: relative;
        z-index: 1;
        width: 66px;
        height: 66px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, rgba(139, 114, 255, 0.3), rgba(99, 102, 241, 0.1));
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 14px 34px -10px rgba(99, 102, 241, 0.65);
        animation: sl-float 2.2s ease-in-out infinite;
      }
      .sl-link {
        width: 32px;
        height: 32px;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sl-link .sl-base {
        stroke: rgba(196, 181, 253, 0.28);
      }
      /* chain link that "draws" itself on loop */
      .sl-link .sl-draw {
        stroke: #d8ccff;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: sl-dash 1.9s ease-in-out infinite;
        filter: drop-shadow(0 0 4px rgba(167, 139, 250, 0.9));
      }

      .sl-brand {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
      }
      .sl-brand span {
        color: var(--sl-violet);
      }
      .sl-msg {
        margin: 0;
        font-size: 13px;
        color: #64748b;
        animation: sl-fade 1.8s ease-in-out infinite;
      }

      /* ---------- Progress bars ---------- */
      .sl-bar {
        position: relative;
        width: 168px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      .sl-bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--sl-violet), var(--sl-pink));
        animation: sl-bar 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      /* thin bar pinned under the navbar while syncing in background */
      .sl-topbar {
        position: fixed;
        top: 4rem;
        left: 0;
        right: 0;
        height: 2px;
        z-index: 40;
        overflow: hidden;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .sl-topbar.is-on {
        opacity: 1;
      }
      .sl-topbar i {
        display: block;
        height: 100%;
        width: 35%;
        background: linear-gradient(90deg, transparent, var(--sl-violet), var(--sl-pink), transparent);
        animation: sl-bar 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* ---------- Skeleton cards ---------- */
      .sl-skel {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        animation: sl-rise 0.4s ease both;
      }
      .sl-skel::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
        animation: sl-shimmer 1.5s ease-in-out infinite;
      }
      .sl-sk {
        background: rgba(255, 255, 255, 0.07);
        border-radius: 8px;
      }

      /* ---------- Keyframes ---------- */
      @keyframes sl-spin { to { transform: rotate(360deg); } }
      @keyframes sl-glow {
        0%, 100% { opacity: 0.55; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes sl-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes sl-dash {
        0% { stroke-dashoffset: 100; }
        45%, 62% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -100; }
      }
      @keyframes sl-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(300%); }
      }
      @keyframes sl-shimmer { to { transform: translateX(100%); } }
      @keyframes sl-fade {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes sl-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .sl-orb::before { animation-duration: 3s; }
        .sl-orb::after,
        .sl-tile,
        .sl-msg,
        .sl-skel,
        .sl-skel::after,
        .sl-bar i,
        .sl-topbar i { animation: none; }
        .sl-link .sl-draw { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant splash: shown until React renders (React replaces #root contents) -->
      <div class="sl-loader" role="status" aria-live="polite">
        <div class="sl-orb">
          <div class="sl-tile">
            <svg class="sl-link" viewBox="0 0 24 24" aria-hidden="true">
              <g class="sl-base">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </g>
              <g class="sl-draw">
                <path pathLength="100" d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path pathLength="100" d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </g>
            </svg>
          </div>
        </div>
        <div class="sl-brand">Link<span>Vault</span></div>
        <div class="sl-bar"><i></i></div>
        <p class="sl-msg">Loading your vault…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
